<!-- ===================== 3.4 MEMORIAS ===================== -->
<h3 id="s-3-4">3.4 Memorias</h3>
<p>Memorias y gamas: la memoria RAM y su evolución (DDR3, DDR4 y DDR5), así como la clasificación de los equipos en gamas baja, media y alta.</p>

<h4 id="s-3-4-1">3.4.1 ¿Qué es la memoria RAM?</h4>
<p>La <strong>RAM (Random Access Memory)</strong> es esencial para que un ordenador almacene y acceda rápidamente a grandes cantidades de datos. Funciona como un búfer, almacenando información temporalmente mientras es procesada por la CPU.</p>
<p>La memoria RAM se mide en gigabytes (GB), comenzando desde 4 GB hasta 32 GB o más, y ha avanzado en los últimos años debido a la demanda de los consumidores. La velocidad de la RAM es crucial, especialmente para la multitarea y los juegos, que requieren más RAM y acceso más rápido.</p>
<p>La RAM también permite una puesta en marcha más rápida de las aplicaciones, reduciendo los tiempos de carga. Invertir en capacidad y velocidad de RAM ayuda a que las computadoras portátiles funcionen sin problemas ni demoras.</p>
<div class="fig-par">
<figure class="fig fig-chica"><img src="imagenes/u3m_ram_chips.png" alt="Chips de memoria RAM sobre un módulo"><figcaption>Chips de un módulo de memoria RAM.</figcaption></figure>
<figure class="fig fig-chica"><img src="imagenes/u3m_ram_azul.png" alt="Módulo de memoria RAM con circuitos verdes sobre fondo azul"><figcaption>Módulo de memoria RAM.</figcaption></figure>
<figure class="fig fig-chica"><img src="imagenes/u3m_ram_arquitectura.png" alt="Arquitectura de memoria RAM: módulo con chips y circuitos"><figcaption>Arquitectura de memoria RAM (ihardware.info).</figcaption></figure>
</div>

<h4 id="s-3-4-2">3.4.2 ¿Cómo funcionan?</h4>
<p>Su función principal es guardar de forma temporal los datos de los programas y aplicaciones que estás usando en el momento para que el procesador (CPU) pueda acceder a ellos de manera casi instantánea.</p>
<ul>
    <li><strong>Lectura y escritura rápida:</strong> a diferencia del disco duro o SSD (que guardan la información a largo plazo aunque apagues el equipo), la RAM es volátil: cuando apagas o reinicias el dispositivo, todo lo que está en la RAM se borra.</li>
    <li><strong>Intermediario con el procesador:</strong> cuando abres un juego o un navegador, el sistema operativo carga los archivos necesarios desde el almacenamiento principal (lento) hacia la RAM (extremadamente rápida). El procesador lee y escribe directamente en la RAM para ejecutar tus acciones sin retrasos.</li>
    <li><strong>Acceso aleatorio:</strong> significa que el procesador puede acceder a cualquier parte de la memoria de forma directa en el mismo tiempo, sin tener que leer los datos en un orden secuencial (como pasaba en las cintas antiguas).</li>
    <li><strong>Estructura física interna:</strong> a nivel microscópico, la RAM está compuesta por millones (o miles de millones) de diminutos condensadores y transistores organizados en una matriz de filas y columnas. Cada intersección en esta cuadrícula forma una celda de memoria que almacena un bit de datos (un 0 o un 1), dependiendo de si el condensador está cargado o descargado eléctricamente.</li>
</ul>
<figure class="fig"><img src="imagenes/u3m_como_funciona.png" alt="Infografía de cómo funciona la memoria RAM: lectura y escritura rápida, intermediario con el procesador, acceso aleatorio y estructura física interna"><figcaption>Cómo funciona la memoria RAM: 1) lectura y escritura rápida, 2) intermediario con el procesador, 3) acceso aleatorio, 4) estructura física interna (matriz de celdas con condensador y transistor).</figcaption></figure>

<h4 id="s-3-4-3">3.4.3 Características</h4>
<p>Existen diferentes tipos de memoria RAM, como la <strong>DRAM</strong>, que es la más común, y la <strong>SRAM</strong>, que es más rápida pero también más costosa. Actualmente, las versiones más utilizadas son DDR3, DDR4 y DDR5.</p>
<p>Entre sus características principales se encuentran la <strong>capacidad</strong>, medida en gigabytes (GB), la <strong>velocidad</strong>, medida en megahertz (MHz), y la <strong>latencia</strong>, que indica el tiempo de respuesta. Estos factores influyen directamente en el rendimiento del equipo.</p>

<h4 id="s-3-4-4">3.4.4 Tipos de memorias</h4>
<h5>Tipos principales</h5>
<ul>
    <li><strong>DDR (DDR3, DDR4, DDR5):</strong> las más usadas actualmente.</li>
    <li><strong>SRAM:</strong> más rápida, pero costosa (usada en caché).</li>
    <li><strong>DRAM:</strong> más común y económica.</li>
    <li><strong>Capacidades (GB):</strong> 4 GB, 8 GB, 16 GB, etc.</li>
    <li><strong>Velocidad (MHz):</strong> influye en el rendimiento.</li>
</ul>
<figure class="fig fig-chica"><img src="imagenes/u3m_tipos.png" alt="Ilustración de DDR5, SRAM (caché), DRAM, capacidades en GB y velocidad en MHz"><figcaption>Tipos de memorias: DDR5, SRAM (caché), DRAM, capacidades (4, 8 y 16 GB) y velocidad (MHz).</figcaption></figure>

<h4 id="s-3-4-5">3.4.5 Memoria DDR3</h4>
<h5>¿Qué es?</h5>
<p>La memoria DDR3, cuyo nombre completo es <strong>Double Data Rate type 3 Synchronous Dynamic Random-Access Memory</strong>, es un tipo de memoria RAM. Como toda RAM, es volátil, lo que significa que pierde la información al apagarse el equipo. Su principal característica es que transmite datos dos veces por ciclo de reloj, lo que le permite alcanzar velocidades superiores a las generaciones anteriores.</p>
<h5>Características</h5>
<p>DDR3 se distingue por varias mejoras técnicas:</p>
<ul>
    <li>Funciona con un voltaje reducido, entre 1.5 y 1.65 voltios, lo que implica menor consumo energético.</li>
    <li>Sus frecuencias de operación van desde 1066 MHz hasta 2133 MHz.</li>
    <li>Los módulos pueden tener capacidades desde 1 GB hasta 16 GB.</li>
    <li>Posee 240 pines, con una muesca distinta a DDR2, lo que evita confusiones al instalarla.</li>
</ul>
<div class="fig-par">
<figure class="fig fig-chica"><img src="imagenes/u3m_ddr3_4gb.png" alt="Módulo DDR3 de 4 GB, 1600 MHz CL11"><figcaption>Módulo DDR3 de 4 GB (1600 MHz, CL11).</figcaption></figure>
<figure class="fig fig-chica"><img src="imagenes/u3m_ddr3_8gb.png" alt="Módulo DDR3 de 8 GB, 1333 MHz CL9"><figcaption>Módulo DDR3 de 8 GB (1333 MHz, CL9).</figcaption></figure>
</div>
<h5>Ventajas frente a DDR2</h5>
<p>Comparada con DDR2, DDR3 ofrece mayor ancho de banda, menor consumo eléctrico y mayor capacidad por módulo. Además, introdujo perfiles XMP que facilitan configuraciones de rendimiento para usuarios avanzados.</p>
<h5>Limitaciones y transición a DDR4</h5>
<p>Con el tiempo, DDR3 fue superada por DDR4, que ofrece velocidades más altas, menor consumo energético y mayor capacidad máxima. A partir de 2014, DDR4 comenzó a reemplazar a DDR3 en la mayoría de los equipos nuevos.</p>
<h5>Aplicaciones y relevancia histórica</h5>
<p>Durante casi una década, DDR3 fue el estándar en PCs, laptops y servidores. Gracias a ella, se pudieron ejecutar programas más exigentes en gráficos, multitarea y virtualización. Aunque hoy ya no se fabrica masivamente, sigue presente en equipos antiguos.</p>


<h4 id="s-3-4-6">3.4.6 Memoria DDR4</h4>
<h5>¿Qué es?</h5>
<p>La memoria DDR4 (Double Data Rate 4) es un tipo de memoria RAM muy popular utilizada en computadoras y laptops. Es la cuarta generación de esta tecnología y se encarga de almacenar temporalmente los datos que el procesador necesita usar al momento.</p>
<h5>Características</h5>
<ul>
    <li><strong>Velocidades:</strong> operan típicamente entre 2133 MHz y 3200 MHz, aunque los módulos de alto rendimiento pueden superar los 4000 MHz.</li>
    <li><strong>Capacidad:</strong> los módulos individuales para consumidores suelen llegar hasta los 32 GB o 64 GB, permitiendo configuraciones de sistema de gran volumen.</li>
    <li><strong>Formato físico:</strong> utilizan un conector de 288 pines para computadoras de escritorio (DIMM) y 260 pines para laptops (SODIMM).</li>
    <li><strong>Eficiencia:</strong> funcionan a un voltaje estándar de 1.2 V, lo que reduce el consumo de energía hasta en un 40 % respecto a la generación anterior.</li>
</ul>
<figure class="fig fig-chica"><img src="imagenes/u3m_ddr4_8gb.png" alt="Módulo DDR4 de 8 GB a 3200 MHz para portátil"><figcaption>Memoria DDR4 de 8 GB a 3200 MHz para portátil.</figcaption></figure>

<h4 id="s-3-4-7">3.4.7 Memoria DDR5</h4>
<h5>¿Qué es?</h5>
<p>La memoria DDR5 (Double Data Rate 5) es la quinta y más avanzada generación de memoria RAM para computadoras, diseñada para ofrecer casi el doble de ancho de banda y velocidad que su antecesora (DDR4) mediante frecuencias que superan los 8000 MHz, una arquitectura interna de doble canal por módulo, tecnología de corrección de errores integrada (On-Die ECC) y un chip de gestión de energía propio (PMIC) que optimiza el consumo a solo 1.1 V para lograr una mayor estabilidad en tareas de alto rendimiento.</p>
<h5>Características</h5>
<ul>
    <li><strong>Velocidad y rendimiento:</strong> la velocidad base comienza en 4800 MT/s, superando los máximos comunes de DDR4 (3200–3600 MHz).</li>
    <li><strong>Mayor capacidad:</strong> los módulos individuales pueden alcanzar 64 GB o 128 GB, ideales para estaciones de trabajo de alto rendimiento.</li>
    <li><strong>Eficiencia energética:</strong> funciona a un voltaje estándar de 1.1 V (frente a 1.2 V o 1.35 V de DDR4), lo que resulta en un menor consumo de energía por bit transmitido.</li>
    <li><strong>Arquitectura de canales:</strong> DDR5 utiliza dos canales de 32 bits independientes por módulo para mejorar la eficiencia en la transferencia de datos.</li>
    <li><strong>Gestión de energía (PMIC):</strong> incorpora el circuito integrado de gestión de energía (PMIC) directamente en el módulo, mejorando la integridad de la señal y la estabilidad.</li>
</ul>
<figure class="fig"><img src="imagenes/u3m_ddr5_estructura.png" alt="Estructura de un módulo DDR5 con PMIC, SPD Hub y DRAM, comparada con DDR4 y DDR3"><figcaption>Estructura del módulo DDR5 (PMIC, SPD Hub, inductores, capacitores, resistencias, PCB y DRAM) comparada con DDR4 y DDR3.</figcaption></figure>

<!-- ===================== 3.5 GAMAS ===================== -->
<h3 id="s-3-5">3.5 Gamas</h3>
<h4 id="s-3-5-1">3.5.1 ¿Qué es una gama?</h4>
<p>Una gama es el nivel o jerarquía con el que se clasifican los dispositivos en categorías (alta, media y baja) según su rendimiento, materiales de construcción y precio, teniendo en el procesador y las cámaras sus mayores elementos diferenciadores.</p>
<div class="info-grid">
    <div class="info-card"><h5>Gama alta</h5><p>Reúne lo último en tecnología, incorporando máxima potencia, pantallas AMOLED de alta calidad e inteligencia artificial avanzada.</p></div>
    <div class="info-card"><h5>Gama media</h5><p>Se posiciona como el punto de equilibrio ideal al ofrecer un rendimiento sólido a un precio accesible.</p></div>
    <div class="info-card"><h5>Gama baja</h5><p>Prioriza la asequibilidad con características funcionales diseñadas para cubrir tareas cotidianas y básicas.</p></div>
</div>
<figure class="fig fig-chica"><img src="imagenes/u3m_gama.png" alt="Ilustración de la nube conectada a un teléfono móvil, una portátil y un ordenador de sobremesa"><figcaption>Gamas: teléfono móvil, portátil y ordenador de sobremesa conectados a la nube.</figcaption></figure>

<h4 id="s-3-5-2">3.5.2 Gama baja</h4>
<h5>¿Qué es?</h5>
<p>Una PC de gama baja es un equipo económico diseñado para tareas básicas como navegar por internet, usar programas de oficina y reproducir contenido multimedia, con componentes de menor potencia y capacidad que los de gamas media o alta. Su principal ventaja es el precio accesible, aunque su rendimiento es limitado para aplicaciones exigentes como videojuegos modernos o software de diseño.</p>
<h5>Características</h5>
<ul>
    <li><strong>Procesador:</strong> modelos básicos como Intel Core i3, Pentium, o AMD Ryzen 3, que ofrecen suficiente potencia para tareas simples.</li>
    <li><strong>Memoria RAM:</strong> generalmente 4 GB a 8 GB, lo que permite multitarea ligera pero con limitaciones si se abren muchos programas a la vez.</li>
    <li><strong>Almacenamiento:</strong> suelen incluir discos duros tradicionales (HDD) de 500 GB a 1 TB, aunque algunos modelos más recientes integran SSD pequeños (128–256 GB) para mejorar la velocidad.</li>
    <li><strong>Tarjeta gráfica:</strong> normalmente integrada en el procesador, adecuada para video en HD y juegos muy ligeros, pero insuficiente para gráficos avanzados.</li>
    <li><strong>Precio:</strong> son las opciones más económicas del mercado, pensadas para estudiantes, oficinas pequeñas o usuarios con necesidades básicas.</li>
</ul>

<h4 id="s-3-5-3">3.5.3 Gama media</h4>
<h5>¿Qué es?</h5>
<p>La gama media se caracteriza por ofrecer un equilibrio entre rendimiento, precio y funcionalidad. Este tipo de equipos está diseñado para usuarios que necesitan más que tareas básicas, pero que no requieren la máxima potencia de una computadora de gama alta. En cuanto al rendimiento, las PCs de gama media suelen contar con procesadores de buena capacidad, como los de Intel (Core i5) o AMD (Ryzen 5). Estos permiten realizar múltiples tareas al mismo tiempo, como trabajar con documentos, navegar en internet, programar, editar contenido ligero e incluso jugar algunos videojuegos sin problemas.</p>
<h5>Características</h5>
<ul>
    <li>En memoria y almacenamiento, normalmente incluyen entre 8 y 16 GB de RAM, lo que garantiza un funcionamiento fluido.</li>
    <li>Suelen incorporar discos SSD, que hacen que el sistema operativo y los programas carguen más rápido en comparación con los discos duros tradicionales.</li>
    <li>Incluyen tarjetas gráficas dedicadas, como las de NVIDIA o AMD, lo que permite ejecutar juegos o programas de diseño a un nivel intermedio.</li>
    <li>Las computadoras de gama media son ideales para estudiantes, oficinistas y usuarios en general, ya que ofrecen un buen desempeño en la mayoría de las tareas diarias sin tener un costo tan elevado como los equipos de gama alta.</li>
</ul>

<h4 id="s-3-5-4">3.5.4 Gama alta</h4>
<h5>¿Qué es?</h5>
<p>La gama alta se refiere a los dispositivos electrónicos como celulares, laptops o tablets. La gama alta ofrece lo mejor en tecnología, materiales y rendimiento. Son los modelos premium de cada marca, diseñados para usuarios que buscan potencia, durabilidad y funciones avanzadas.</p>
<h5>Características</h5>
<ul>
    <li><strong>Rendimiento:</strong> procesadores más potentes (Snapdragon, Apple A-series) y gran memoria RAM, asegurando rapidez y eficiencia.</li>
    <li><strong>Cámaras:</strong> sistemas multicámara de alta resolución, enfoque en fotografía nocturna y grabación de video avanzada.</li>
    <li><strong>Pantalla:</strong> paneles con alta resolución, altas tasas de refresco (120 Hz o más) y gran brillo (hasta 3500 nits).</li>
    <li><strong>Construcción:</strong> materiales premium (cristal, titanio) y resistencia al agua/polvo, usualmente certificación IP68.</li>
    <li><strong>Batería y carga:</strong> capacidad alta (sobre 5000 mAh) con carga rápida por cable (más de 100 W) e inalámbrica.</li>
</ul>

        }

        function irASeccion() {
            const id = decodeURIComponent(window.location.hash.replace('#', ''));
            if (!id) return;
            const el = document.getElementById(id);
            if (!el) return;
            setTimeout(() => {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                el.classList.add('resaltado');
                setTimeout(() => el.classList.remove('resaltado'), 2200);
            }, 150);
        }

        const params = new URLSearchParams(window.location.search);
        const tema = params.get('tema');

        if (temas[tema]) {
            document.getElementById('tema-titulo').textContent = temas[tema].titulo;
            document.getElementById('tema-descripcion').textContent = temas[tema].descripcion;
            document.getElementById('tema-contenido').innerHTML = temas[tema].contenido;
            construirIndice();
            irASeccion();
        } else {
            document.getElementById('tema-titulo').textContent = "Tema no encontrado";
            document.getElementById('tema-descripcion').textContent = "No existe información para este tema.";
            document.getElementById('tema-contenido').innerHTML = "<p>Regresa al índice para elegir otro tema.</p>";
        }
    </script>

</body>
</html>
